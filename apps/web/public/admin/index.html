    <title>Content Manager</title>

  <body>
    <!--
      Decap CMS, pinned to an exact version with a Subresource Integrity hash. To upgrade: change
      the version in the URL and recompute the hash (see docs/cms.md, "Upgrading Decap"). The
      browser refuses the script if the bytes at this URL ever differ from the hash.
      Decap reads its configuration from ./config.yml next to this file.
    -->
    <script
      src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"
      integrity="sha384-A/Gdn928CNLufmnGWGs9RM4Q9o8bSNLeJERqBFrBjwzL7FRpoLT3MPF8Tl0+Wd2p"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
